plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.cleanhome.gtv'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.cleanhome.gtv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // Shared Google Photos album for the background: ./gradlew assembleRelease -PalbumUrl=https://photos.app.goo.gl/...
        resValue 'string', 'photos_album_url', (project.findProperty('albumUrl') ?: '')
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
